name: portable-workflow-tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -B -m unittest discover -s workflow/tests -v
      - run: python -B workflow/portable.py doctor --config workflow/examples/demo.json
      - run: python -B workflow/portable.py run --config workflow/examples/demo.json --offline
      - run: python -B workflow/portable.py run --config workflow/examples/demo.json --offline
